<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Analysis</title>
  <link rel="stylesheet" href="../style.css">
  <!-- Global site script (nav menu & theme switcher) -->
  <script type="module" src="../global.js"></script>
  <!-- D3 visualization logic for Lab 06 & Lab 08 -->
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>Codebase Meta-Analysis</h1>

  <!-- Summary Statistics -->
  <div id="stats"></div>

  <!-- Scrollytelling Part 1: Commits Scatterplot -->
  <h2>Commits by Time of Day</h2>
  <div id="scrolly-1" class="scrolly-container">
    <div id="scatter-story" class="story-column"></div>
    <div id="scatter-plot" class="sticky-visual">
      <div id="chart"></div>

      <!-- Brush Selection Results -->
      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
    </div>
  </div>

  <!-- Scrollytelling Part 2 (Step 4): Unit Visualization for File Sizes -->
  <h2>Codebase File Sizes</h2>
  <div id="scrolly-2" class="scrolly-container">
    <div id="files-story" class="story-column"></div>
    <div id="files-container" class="sticky-visual">
      <dl id="files"></dl>
    </div>
  </div>

  <!-- Hover Tooltip -->
  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>
  </dl>
</body>
</html>
