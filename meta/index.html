<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Analysis</title>
  <link rel="stylesheet" href="../style.css">
  <!-- Load global.js to render navigation bar and dark mode theme switcher -->
  <script type="module" src="../global.js"></script>
  <!-- Load main.js for D3 stats and scatterplot -->
  <script type="module" src="main.js"></script>
</head>
<body>
  <h1>Codebase Meta-Analysis</h1>

  <!-- Summary Statistics -->
  <div id="stats"></div>

  <!-- Quantitative Scatterplot Chart -->
  <h2>Commits by Time of Day</h2>
  <div id="chart"></div>

  <!-- Hover Tooltip -->
  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>
  </dl>
</body>
</html>
