<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="../style.css">
    <!-- Inside subpages like projects/index.html -->
    <script src="../global.js" type="module"></script>
    <script src="projects.js" type="module"></script>
</head>
<body>
    <main>
        <h1 class="projects-title">Projects</h1>

        <!-- Step 1.1 & 2.3: Visualization & Legend Container -->
        <div class="container">
            <svg id="projects-pie-plot" viewBox="-50 -50 100 100"></svg>
            <ul class="legend"></ul>
        </div>

        <!-- Step 4.1: Search Field -->
        <input 
            type="search" 
            class="search-bar" 
            placeholder="Search projects…" 
            aria-label="Search projects"
        />

        <!-- Step 3.1: Dynamic Projects Container -->
        <div class="projects">
            <!-- Projects rendered via projects.js -->
        </div>
    </main>
</body>
</html>
